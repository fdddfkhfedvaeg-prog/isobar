function SensorCard({ feel }) {
  const [stage, setStage] = useState(0);
  const [prog, setProg] = useState(0);
  const [result, setResult] = useState('Press and hold');
  const st = useRef(null);
  const resultTimer = useRef(null);

  const labels = ['Hold to focus', 'Focus locked', 'Shutter', 'Recording'];

  const stop = () => {
    const p = st.current;
    if (!p) return;
    cancelAnimationFrame(p.raf);
    clearInterval(p.vid);
    const s = p.stage;
    st.current = null;
    setStage(0);
    setProg(0);
    setResult(s >= 3 ? 'Video saved' : s === 2 ? 'Photo captured' : s === 1 ? 'Focus locked. Release to cancel.' : 'Press and hold');
    clearTimeout(resultTimer.current);
    resultTimer.current = setTimeout(() => setResult('Press and hold'), 1800);
  };

  const start = (e) => {
    if (st.current) return;
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* older browsers */ }
    const t0 = performance.now();
    const p = { stage: 0, raf: 0, vid: 0 };
    st.current = p;
    setStage(0);
    const tick = () => {
      if (st.current !== p) return;
      const el = performance.now() - t0;
      setProg(clamp(el / 1300, 0, 1));
      if (p.stage < 1 && el >= 280) {
        p.stage = 1;
        setStage(1);
        feel.fire([{ d: 0, a: 0.35, f: 70, tau: 0.03 }], [8]);
        feel.play('tick');
      }
      if (p.stage < 2 && el >= 700) {
        p.stage = 2;
        setStage(2);
        feel.fire([{ d: 0, a: 1, f: 34, tau: 0.06 }], [24]);
        feel.play('click');
        feel.play('thump');
      }
      if (p.stage < 3 && el >= 1300) {
        p.stage = 3;
        setStage(3);
        p.vid = setInterval(() => {
          feel.fire([{ d: 0, a: 0.45, f: 60, tau: 0.04 }], [10]);
          feel.play('tick', 0, 0.8);
        }, 420);
      }
      p.raf = requestAnimationFrame(tick);
    };
    p.raf = requestAnimationFrame(tick);
  };

  useEffect(() => () => { stop(); clearTimeout(resultTimer.current); }, []);

  return (
    <div className="card feel-card">
      <div className="card-head">
        <span className="eyebrow"><Aperture size={13} /> Haptic Smart Camera Sensor</span>
        <span className={`status ${stage ? 'is-live' : ''}`}>{labels[stage]}</span>
      </div>
      <h3 className="card-title">A shutter you can feel half-pressed.</h3>
      <div className="sensor-stage">
        <motion.button
          type="button"
          className="sensor-pad"
          aria-label="Press and hold the camera sensor. Light press focuses, firm press shoots, hold to record."
          style={{ '--p': `${prog * 100}%` }}
          animate={{ scale: stage ? 0.93 : 1 }}
          whileHover={{ scale: stage ? 0.93 : 1.03 }}
          transition={{ type: 'spring', stiffness: 520, damping: 15 }}
          onPointerDown={start}
          onPointerUp={stop}
          onPointerCancel={stop}
          onKeyDown={(e) => { if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) { e.preventDefault(); start({ currentTarget: e.currentTarget, pointerId: 0 }); } }}
          onKeyUp={(e) => { if (e.key === 'Enter' || e.key === ' ') stop(); }}
        >
          <span className="sensor-ring" />
          <span className="sensor-core">
            {stage >= 3 ? <i className="rec-dot" /> : <Camera size={30} />}
          </span>
        </motion.button>
        <div className="sensor-steps" aria-hidden="true">
          {['Focus', 'Shoot', 'Record'].map((s, i) => (
            <span key={s} className={stage > i ? 'is-on' : ''}>{s}</span>
          ))}
        </div>
      </div>
      <p className="note" aria-live="polite">{result}</p>
    </div>
  );
}

        <div>
          <p className="footer-brand">iPhone <b>18</b></p>
          <p className="footer-line">Titanium. Redefined. Intelligence beyond dimensions.</p>
        </div>
        <p className="footer-legal">
          A private concept prototype for internal preview. Names, specifications and figures are illustrative and do not describe a shipping product or an announcement. iPhone is a trademark of Apple Inc. This page is not affiliated with or endorsed by Apple Inc.
        </p>
      </div>
    </footer>
  );
}

function App() {
  const [modelId, setModelId] = useState('promax');
  const [finishes, setFinishes] = useState({ promax: 0, pro: 0, std: 0, slim: 0 });
  const [active, setActive] = useState('top');
  const model = MODELS.find((m) => m.id === modelId);
  const finishIdx = finishes[modelId];
  const finish = model.finishes[finishIdx];
  const setFinishIdx = (i) => setFinishes((f) => ({ ...f, [modelId]: i }));

  const { scrollYProgress } = useScroll();
  const scaleX = useSpring(scrollYProgress, { stiffness: 120, damping: 26, mass: 0.4 });

  useEffect(() => {
    if (typeof IntersectionObserver === 'undefined') return undefined;
    const els = NAV_LINKS.map(([id]) => document.getElementById(id)).filter(Boolean);
    const io = new IntersectionObserver(
      (entries) => entries.forEach((e) => { if (e.isIntersecting) setActive(e.target.id); }),
      { rootMargin: '-45% 0px -50% 0px' },
    );
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);

  return (
    <div className="app" style={{ '--glow': finish.glow }}>
      <motion.div className="progress" style={{ scaleX }} aria-hidden="true" />
      <Nav active={active} />
      <main>
        <Hero model={model} setModelId={setModelId} finishIdx={finishIdx} setFinishIdx={setFinishIdx} />
        <Statement />
        <ChipSection tint={finish.tint} />
        <CameraSection />
        <DisplaySection tint={finish.tint} />
        <MaterialsSection />
        <CompareSection model={model} setModelId={setModelId} finishIdx={finishIdx} setFinishIdx={setFinishIdx} />
        <FeelSection tint={finish.tint} />
      </main>
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
